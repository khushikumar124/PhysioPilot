# Render blueprint: the PhysioPilot API and its database.
#
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repo.
# The frontend is deployed separately on Vercel; see docs/DEPLOYMENT.md.
services:
  - type: web
    name: physiopilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker keeps the free tier's memory headroom; this is a demo API.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PHYSIOPILOT_DATABASE_URL
        fromDatabase:
          name: physiopilot-db
          property: connectionString
      - key: PHYSIOPILOT_SECRET_KEY
        # Render generates this once and keeps it. Regenerating it signs every
        # existing session out, so leave it alone after the first deploy.
        generateValue: true
      - key: PHYSIOPILOT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      # Creates the demo clinic on first boot, only while the database is
      # empty. Set to false once you have real data you care about.
      - key: PHYSIOPILOT_SEED_DEMO_ON_STARTUP
        value: "true"
      # Set this to the Vercel URL once the frontend is deployed. Comma
      # separated; no trailing slash. Without it the browser blocks every call.
      - key: PHYSIOPILOT_CORS_ORIGINS
        sync: false
      # Optional: enables the LLM-backed assistant. Left unset, the assistant
      # falls back to its deterministic responder and still works.
      - key: PHYSIOPILOT_ANTHROPIC_API_KEY
        sync: false

databases:
  - name: physiopilot-db
    plan: free
    databaseName: physiopilot
