<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>PhysioPilot</title>
    <meta
      name="description"
      content="PhysioPilot connects physiotherapists and patients from prescription to recovery."
    />
  </head>
  <body>
    <script>
      // Set the theme before the first paint. Without this a dark-mode user
      // gets a full-brightness flash on every load.
      (function () {
        try {
          var stored = localStorage.getItem("physiopilot.theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
